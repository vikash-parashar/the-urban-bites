# Render blueprint: the website (free static site) and the Go API (free web service), both in Singapore.
# Render → Blueprints → the-urban-bites → Manual sync picks up changes here.
services:
  - type: web
    name: the-urban-bites-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/shop
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://theurbanbites.in,https://www.theurbanbites.in,https://the-urban-bites.onrender.com,https://the-urban-bites.pages.dev

  # The customer website and staff area (/#staff). Static sites on Render are free and never sleep.
  - type: web
    name: the-urban-bites
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://the-urban-bites-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
