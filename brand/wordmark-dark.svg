<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360"><svg x="0" y="20" width="320" height="320" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a52"/><stop offset="1" stop-color="#060918"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="bite"><rect width="512" height="512" fill="#fff"/><circle cx="470" cy="42" r="70" fill="#000"/><circle cx="398" cy="20" r="34" fill="#000"/><circle cx="492" cy="112" r="34" fill="#000"/></mask>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#f0a417"/></linearGradient>
  </defs>
  <g mask="url(#bite)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <!-- hut roof in blue LED -->
    <g filter="url(#glow)" fill="none" stroke="#4d6bff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 214 L256 104 L416 214"/>
    </g>
    <path d="M150 206 L256 134 L362 206" fill="none" stroke="#f5b82e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <!-- UB -->
    <text x="256" y="418" text-anchor="middle" font-family="Anton" font-size="218" fill="url(#gold)" letter-spacing="-4">UB</text>
    <!-- steam -->
    <g fill="none" stroke="#f6efe0" stroke-width="7" stroke-linecap="round" opacity=".85">
      <path d="M226 92 c-14 -16 14 -26 0 -44"/><path d="M262 82 c-14 -16 14 -26 0 -44"/>
    </g>
  </g>
</svg>
  <text x="360" y="150" font-family="Anton" font-size="92" fill="#f6efe0" letter-spacing="6">THE URBAN</text>
  <text x="356" y="300" font-family="Kalam" font-size="170" fill="#f5b82e">Bites</text>
  <text x="790" y="296" font-family="Hind" font-size="34" fill="#f6efe0" opacity=".8">JULANA BYPASS</text></svg>