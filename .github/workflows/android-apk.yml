# Builds the Android app on GitHub's servers and puts the APKs on the "Latest APK" release,
# so they can be downloaded straight to a phone.
#   urban-bites-demo.apk  runs with no server: sample data and test logins on the phone.
#   urban-bites-live.apk  talks to the real API (set the repository variable API_URL first).
name: Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Build demo APK
        run: |
          flutter build apk --release --dart-define=DEMO=true
          cp build/app/outputs/flutter-apk/app-release.apk ../urban-bites-demo.apk
      - name: Build live APK
        if: ${{ vars.API_URL != '' }}
        run: |
          flutter build apk --release --dart-define=API_URL=${{ vars.API_URL }} --dart-define=SITE_URL=${{ vars.SITE_URL || 'https://theurbanbites.in' }}
          cp build/app/outputs/flutter-apk/app-release.apk ../urban-bites-live.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: urban-bites-*.apk
      - name: Publish to the Latest APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest APK" --notes "Built from main. Install urban-bites-demo.apk to try the app with test logins."
          gh release upload apk-latest urban-bites-*.apk --clobber
