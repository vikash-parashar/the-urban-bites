# Builds The Urban Bites app on GitHub's servers and puts it on the "Latest APK" release.
# The app is the live website (theurbanbites.in) in a native shell, so new website features
# reach the app without a new build. Rebuild only when the shell itself changes.
#   urban-bites.apk               Android phones and tablets: download and install.
#   urban-bites-ios-unsigned.ipa  iPhone/iPad: needs signing (Apple Developer account, or a free
#                                 Apple ID with Sideloadly/AltStore, which lasts 7 days).
name: Apps

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASSWORD not set: signed with a throwaway debug key, so this APK won't install over an older one."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=urbanbites\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - name: Build APK
        # Push notifications: the four FB_* repository variables come from the Firebase console
        # (Project settings, Your apps, Android app com.theurbanbites.app). Not secret: they ship in every APK.
        run: |
          [ -n "${{ vars.FB_APP_ID }}" ] || echo "::warning::FB_* variables not set: this APK has no push notifications."
          flutter build apk --release --dart-define=SITE_URL=${{ vars.SITE_URL || 'https://theurbanbites.in' }} \
            --dart-define=FB_API_KEY=${{ vars.FB_API_KEY }} --dart-define=FB_APP_ID=${{ vars.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ vars.FB_SENDER_ID }} --dart-define=FB_PROJECT_ID=${{ vars.FB_PROJECT_ID }}
          cp build/app/outputs/flutter-apk/app-release.apk ../urban-bites.apk
          cp ../urban-bites.apk ../urban-bites-live.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: urban-bites*.apk
      - name: Publish to the Latest APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest APK" --notes "Built from main."
          gh release delete-asset apk-latest urban-bites-demo.apk -y 2>/dev/null || true
          gh release upload apk-latest urban-bites.apk urban-bites-live.apk --clobber

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --dart-define=SITE_URL=${{ vars.SITE_URL || 'https://theurbanbites.in' }}
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../urban-bites-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: urban-bites-ios-unsigned.ipa
      - name: Publish to the Latest APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest APK" --notes "Built from main."
          gh release upload apk-latest urban-bites-ios-unsigned.ipa --clobber
