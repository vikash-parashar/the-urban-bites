name: Reel voice-over

# Records the reel voice-over lines (reels/vo-lines.json) with the website's neural voices and
# commits the MP3s back to the branch that changed them.
on:
  push:
    branches: ['claude/**']
    paths: [reels/vo-lines.json, scripts/reel_vo.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.3.1
      - run: python scripts/reel_vo.py
      - name: Commit clips
        run: |
          git add reels/vo
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Reel voice-over: record lines"
          git push origin HEAD:${GITHUB_REF_NAME}
