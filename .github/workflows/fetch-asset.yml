# Downloads an image (for example an AI-generated character from Runway) into the repo.
# The cloud editing machine can't reach some CDNs, but GitHub's runners can.
name: Fetch asset
on:
  workflow_dispatch:
    inputs:
      url:
        description: Image URL to download
        required: true
      path:
        description: Where to save it in the repo (under web/public/)
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$DEST" in web/public/*) ;; *) echo "path must be under web/public/"; exit 1;; esac
          case "$DEST" in *..*) echo "bad path"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL "$URL" -o "$DEST"
          file "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add asset $DEST" || exit 0
          git push
