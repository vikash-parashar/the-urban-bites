name: urban_bites
description: The Urban Bites app. Customers order; the owner runs the cart from a tablet.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.3
  printing: ^5.15.1
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/menu.json
    - assets/dishes/
    - assets/hero/
    - assets/mark-512.png
    - assets/wordmark-dark.png
    - assets/wordmark-light.png
    - assets/fonts/Hind-Regular.ttf
    - assets/fonts/Hind-Bold.ttf
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
