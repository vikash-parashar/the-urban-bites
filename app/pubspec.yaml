name: urban_bites
description: The Urban Bites app. The live website in an app, with native permissions, sounds and a keep-awake staff screen.
publish_to: none
version: 2.0.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  permission_handler: ^12.0.1
  wakelock_plus: ^1.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mark-512.png
    - assets/fonts/Hind-Regular.ttf
    - assets/fonts/Hind-Bold.ttf
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
